name: Fire check

on:
  # Fire advisory feature disabled for now (WFIGS false-positive rate, missing FIRMS_MAP_KEY).
  # Re-enable by uncommenting the schedule below — the API route and cron logic are untouched.
  # schedule:
  #   - cron: "*/20 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call fire-check cron route
        run: |
          curl --fail --show-error \
            --max-time 30 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/fire-check"
